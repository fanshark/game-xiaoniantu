<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小黏土走走走 - RPG冒险</title>
    <style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #1a1a2e;
    font-family: 'Microsoft YaHei', 'SimHei', sans-serif;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

#game-container {
    position: relative;
    width: 1200px;
    height: 900px;
    border: 3px solid #ffb6c1;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 0 30px rgba(255, 182, 193, 0.3);
}

.screen {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: none;
}

.screen.active {
    display: block;
}

canvas {
    display: block;
}

#intro-canvas, #game-canvas {
    width: 100%;
    height: 100%;
}

/* Skip button */
.btn-skip {
    position: absolute;
    top: 15px;
    right: 15px;
    background: rgba(0, 0, 0, 0.6);
    color: #fff;
    border: 1px solid #ffb6c1;
    padding: 8px 16px;
    border-radius: 20px;
    cursor: pointer;
    font-size: 14px;
    z-index: 100;
    transition: all 0.3s;
}

.btn-skip:hover {
    background: rgba(255, 182, 193, 0.4);
}

/* HUD */
#hud {
    position: absolute;
    top: 10px;
    left: 10px;
    background: rgba(0, 0, 0, 0.7);
    color: #fff;
    padding: 10px 15px;
    border-radius: 10px;
    font-size: 13px;
    line-height: 1.8;
    border: 1px solid rgba(255, 182, 193, 0.5);
}

.hud-label {
    color: #ffb6c1;
    font-weight: bold;
}

/* Minimap */
#minimap {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 150px;
    height: 120px;
    background: rgba(0, 0, 0, 0.7);
    border: 1px solid rgba(255, 182, 193, 0.5);
    border-radius: 8px;
    overflow: hidden;
}

#minimap-canvas {
    width: 100%;
    height: 100%;
}

/* Overlays */
.overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: flex-end;
    z-index: 50;
    pointer-events: none;
}

.overlay > div {
    pointer-events: all;
}

.overlay.hidden {
    display: none;
}

/* Dialogue */
#dialogue-box {
    width: 90%;
    max-width: 700px;
    background: rgba(20, 20, 40, 0.95);
    border: 2px solid #ffb6c1;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
    color: #fff;
}

#dialogue-speaker {
    color: #ffb6c1;
    font-weight: bold;
    font-size: 16px;
    margin-bottom: 8px;
}

#dialogue-text {
    font-size: 15px;
    line-height: 1.6;
    margin-bottom: 15px;
    min-height: 40px;
}

#dialogue-choices {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
}

#dialogue-choices button {
    background: rgba(255, 182, 193, 0.2);
    border: 1px solid #ffb6c1;
    color: #fff;
    padding: 8px 16px;
    border-radius: 20px;
    cursor: pointer;
    font-size: 14px;
    transition: all 0.3s;
}

#dialogue-choices button:hover {
    background: rgba(255, 182, 193, 0.5);
    transform: scale(1.05);
}

#dialogue-input-area {
    display: flex;
    gap: 8px;
    margin-top: 10px;
}

#dialogue-input-area.hidden {
    display: none;
}

#dialogue-input {
    flex: 1;
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid #ffb6c1;
    color: #fff;
    padding: 10px 15px;
    border-radius: 20px;
    font-size: 14px;
    outline: none;
}

#dialogue-input:focus {
    border-color: #ff69b4;
    box-shadow: 0 0 10px rgba(255, 105, 180, 0.3);
}

#dialogue-send {
    background: #ff69b4;
    color: #fff;
    border: none;
    padding: 10px 20px;
    border-radius: 20px;
    cursor: pointer;
    font-size: 14px;
    transition: all 0.3s;
}

#dialogue-send:hover {
    background: #ff1493;
}

/* Shop */
#shop-box {
    width: 80%;
    max-width: 600px;
    background: rgba(20, 20, 40, 0.95);
    border: 2px solid #ffd700;
    border-radius: 12px;
    padding: 25px;
    margin-bottom: 30px;
    color: #fff;
    max-height: 70%;
    overflow-y: auto;
}

#shop-box h2 {
    color: #ffd700;
    text-align: center;
    margin-bottom: 15px;
}

#shop-items {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin-bottom: 15px;
}

.shop-item {
    background: rgba(255, 215, 0, 0.1);
    border: 1px solid rgba(255, 215, 0, 0.4);
    border-radius: 8px;
    padding: 12px;
    cursor: pointer;
    transition: all 0.3s;
    text-align: center;
}

.shop-item:hover {
    background: rgba(255, 215, 0, 0.25);
    transform: scale(1.02);
}

.shop-item .item-name {
    font-weight: bold;
    color: #ffd700;
    margin-bottom: 4px;
}

.shop-item .item-price {
    font-size: 12px;
    color: #aaa;
}

.shop-item .item-desc {
    font-size: 11px;
    color: #ccc;
    margin-top: 4px;
}

.btn-action {
    display: block;
    margin: 0 auto;
    background: rgba(255, 182, 193, 0.3);
    border: 1px solid #ffb6c1;
    color: #fff;
    padding: 10px 25px;
    border-radius: 20px;
    cursor: pointer;
    font-size: 14px;
    transition: all 0.3s;
}

.btn-action:hover {
    background: rgba(255, 182, 193, 0.6);
}

/* Combat */
#combat-overlay {
    align-items: flex-start;
    pointer-events: none;
}

#combat-hud {
    width: 90%;
    padding: 15px;
    margin-top: 10px;
    display: flex;
    justify-content: center;
    gap: 20px;
    align-items: center;
}

#enemy-info {
    background: rgba(0, 0, 0, 0.8);
    padding: 8px 15px;
    border-radius: 8px;
    border: 1px solid #ff4444;
    min-width: 200px;
}

#enemy-name {
    color: #ff6666;
    font-weight: bold;
    font-size: 14px;
}

#enemy-hp-bar {
    width: 100%;
    height: 8px;
    background: #333;
    border-radius: 4px;
    margin-top: 5px;
    overflow: hidden;
}

#enemy-hp-fill {
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, #ff4444, #ff6666);
    border-radius: 4px;
    transition: width 0.3s;
}

#combat-counter {
    background: rgba(0, 0, 0, 0.8);
    padding: 8px 15px;
    border-radius: 8px;
    border: 1px solid #9b59b6;
    color: #bb77dd;
    font-weight: bold;
}

#combat-counter.hidden {
    display: none;
}

/* Game Over */
#gameover-screen {
    background: rgba(0, 0, 0, 0.9);
    justify-content: center;
    align-items: center;
}

#gameover-screen.active {
    display: flex;
}

#gameover-content {
    text-align: center;
    color: #fff;
}

#gameover-content h1 {
    font-size: 42px;
    margin-bottom: 20px;
}

#gameover-content p {
    font-size: 18px;
    margin-bottom: 30px;
    color: #ccc;
}

/* Notification */
.notification {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0, 0, 0, 0.85);
    color: #fff;
    padding: 15px 30px;
    border-radius: 10px;
    border: 1px solid #ffb6c1;
    font-size: 16px;
    z-index: 200;
    animation: fadeInOut 2s forwards;
    pointer-events: none;
    text-align: center;
}

@keyframes fadeInOut {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
    15% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    75% { opacity: 1; }
    100% { opacity: 0; transform: translate(-50%, -60%) scale(0.9); }
}

/* Zone transition */
.zone-transition {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: #000;
    z-index: 100;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #ffb6c1;
    font-size: 24px;
    animation: zoneFade 1.5s forwards;
}

@keyframes zoneFade {
    0% { opacity: 1; }
    50% { opacity: 1; }
    100% { opacity: 0; pointer-events: none; }
}

/* Save indicator */
#save-indicator {
    position: absolute;
    bottom: 10px;
    right: 10px;
    color: rgba(255, 255, 255, 0.5);
    font-size: 11px;
}
    </style>
</head>
<body>
    <!-- 游戏容器 -->
    <div id="game-container">
        <!-- 开场动画层 -->
        <div id="intro-screen" class="screen active">
            <canvas id="intro-canvas"></canvas>
            <button id="skip-intro" class="btn-skip">跳过 Skip</button>
        </div>

        <!-- 游戏主画面 -->
        <div id="game-screen" class="screen">
            <canvas id="game-canvas"></canvas>
            <!-- HUD -->
            <div id="hud">
                <div id="hud-size"><span class="hud-label">体型:</span> <span id="size-display">5mm</span></div>
                <div id="hud-coins"><span class="hud-label">金币:</span> <span id="coins-display">0</span></div>
                <div id="hud-hp"><span class="hud-label">HP:</span> <span id="hp-display">100/100</span></div>
                <div id="hud-pet"><span class="hud-label">宠物:</span> <span id="pet-display">无</span></div>
                <div id="hud-weapon"><span class="hud-label">武器:</span> <span id="weapon-display">无</span></div>
                <div id="hud-zone"><span class="hud-label">区域:</span> <span id="zone-display">起始小路</span></div>
            </div>
            <!-- 小地图 -->
            <div id="minimap">
                <canvas id="minimap-canvas"></canvas>
            </div>
        </div>

        <!-- 对话界面 -->
        <div id="dialogue-overlay" class="overlay hidden">
            <div id="dialogue-box">
                <div id="dialogue-speaker"></div>
                <div id="dialogue-text"></div>
                <div id="dialogue-choices"></div>
                <div id="dialogue-input-area" class="hidden">
                    <input type="text" id="dialogue-input" placeholder="输入你想说的话..." autocomplete="off">
                    <button id="dialogue-send">发送</button>
                </div>
            </div>
        </div>

        <!-- 商店界面 -->
        <div id="shop-overlay" class="overlay hidden">
            <div id="shop-box">
                <h2 id="shop-title">商店</h2>
                <div id="shop-items"></div>
                <button id="shop-close" class="btn-action">离开商店</button>
            </div>
        </div>

        <!-- 战斗界面 -->
        <div id="combat-overlay" class="overlay hidden">
            <div id="combat-hud">
                <div id="enemy-info">
                    <span id="enemy-name"></span>
                    <div id="enemy-hp-bar"><div id="enemy-hp-fill"></div></div>
                </div>
                <div id="combat-counter" class="hidden">
                    <span>击败小菌: </span><span id="fungi-count">0</span>/100
                </div>
            </div>
        </div>

        <!-- 游戏结束 -->
        <div id="gameover-screen" class="screen hidden">
            <div id="gameover-content">
                <h1 id="gameover-title"></h1>
                <p id="gameover-text"></p>
                <button id="gameover-restart" class="btn-action">重新开始</button>
            </div>
        </div>
    </div>

</body>
<script>
// === assets.js ===
// assets.js - Programmatic sprite/asset generation
const Assets = {
    // Color palette
    colors: {
        pink: '#ff69b4',
        pinkLight: '#ffb6c1',
        pinkDark: '#c71585',
        grass: '#4caf50',
        grassDark: '#388e3c',
        sand: '#f4d03f',
        sandDark: '#d4ac0f',
        water: '#42a5f5',
        waterDark: '#1976d2',
        rock: '#78909c',
        tree: '#2e7d32',
        treeTrunk: '#5d4037',
        cave: '#37474f',
        mountain: '#455a64',
        gold: '#ffd700',
        heart: '#ff1744',
        enemy: '#7b1fa2',
        fungi: '#9c27b0',
        boss: '#b71c1c',
    },

    // Draw the pink clay player at different growth stages
    drawPlayer(ctx, x, y, size, stage) {
        // stage: 0-4 (tiny, small, medium, large, giant)
        const radius = 8 + stage * 4;
        const bodyColor = this.colors.pink;
        
        ctx.save();
        ctx.translate(x, y);
        
        // Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.2)';
        ctx.beginPath();
        ctx.ellipse(0, radius * 0.8, radius * 0.8, radius * 0.3, 0, 0, Math.PI * 2);
        ctx.fill();
        
        // Body (soft blob shape)
        ctx.fillStyle = bodyColor;
        ctx.beginPath();
        ctx.ellipse(0, 0, radius, radius * 1.1, 0, 0, Math.PI * 2);
        ctx.fill();
        
        // Highlight
        ctx.fillStyle = 'rgba(255,255,255,0.4)';
        ctx.beginPath();
        ctx.ellipse(-radius * 0.3, -radius * 0.3, radius * 0.3, radius * 0.25, -0.5, 0, Math.PI * 2);
        ctx.fill();
        
        // Eyes
        ctx.fillStyle = '#333';
        ctx.beginPath();
        ctx.arc(-radius * 0.25, -radius * 0.1, 2 + stage * 0.5, 0, Math.PI * 2);
        ctx.arc(radius * 0.25, -radius * 0.1, 2 + stage * 0.5, 0, Math.PI * 2);
        ctx.fill();
        
        // Smile
        ctx.strokeStyle = '#333';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(0, radius * 0.15, radius * 0.25, 0.1, Math.PI - 0.1);
        ctx.stroke();
        
        // Blush
        ctx.fillStyle = 'rgba(255, 100, 150, 0.4)';
        ctx.beginPath();
        ctx.ellipse(-radius * 0.5, radius * 0.1, radius * 0.15, radius * 0.1, 0, 0, Math.PI * 2);
        ctx.ellipse(radius * 0.5, radius * 0.1, radius * 0.15, radius * 0.1, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
        return radius;
    },

    // Draw clay drop collectible (subtle, partially hidden)
    drawClayDrop(ctx, x, y, time) {
        ctx.save();
        ctx.translate(x, y);
        const bounce = Math.sin(time * 2) * 1;
        ctx.translate(0, bounce);
        
        // Very subtle glow
        ctx.fillStyle = 'rgba(255, 182, 193, 0.15)';
        ctx.beginPath();
        ctx.arc(0, 0, 6, 0, Math.PI * 2);
        ctx.fill();
        
        // Small clay ball
        ctx.fillStyle = 'rgba(255, 150, 180, 0.7)';
        ctx.beginPath();
        ctx.arc(0, 0, 4, 0, Math.PI * 2);
        ctx.fill();
        
        // Tiny shine
        ctx.fillStyle = 'rgba(255,255,255,0.4)';
        ctx.beginPath();
        ctx.arc(-1, -1, 1.5, 0, Math.PI * 2);
        ctx.fill();
        
        ctx.restore();
    },

    // Draw Giant Clay (special item)
    drawGiantClay(ctx, x, y, time) {
        ctx.save();
        ctx.translate(x, y);
        const pulse = 1 + Math.sin(time * 2) * 0.1;
        ctx.scale(pulse, pulse);
        
        // Glow ring
        ctx.strokeStyle = 'rgba(255, 215, 0, 0.5)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(0, 0, 18, 0, Math.PI * 2);
        ctx.stroke();
        
        // Big clay ball
        const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, 14);
        gradient.addColorStop(0, '#ffb6c1');
        gradient.addColorStop(1, '#ff69b4');
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(0, 0, 14, 0, Math.PI * 2);
        ctx.fill();
        
        // Star sparkles
        ctx.fillStyle = '#ffd700';
        for (let i = 0; i < 4; i++) {
            const angle = time * 2 + (i * Math.PI / 2);
            const sx = Math.cos(angle) * 16;
            const sy = Math.sin(angle) * 16;
            ctx.beginPath();
            ctx.arc(sx, sy, 2, 0, Math.PI * 2);
            ctx.fill();
        }
        
        ctx.restore();
    },

    // Draw coin
    drawCoin(ctx, x, y, time) {
        ctx.save();
        ctx.translate(x, y);
        const spin = Math.abs(Math.cos(time * 2));
        
        ctx.fillStyle = this.colors.gold;
        ctx.beginPath();
        ctx.ellipse(0, 0, 5 * spin, 5, 0, 0, Math.PI * 2);
        ctx.fill();
        
        ctx.fillStyle = '#b8860b';
        ctx.font = '7px bold sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        if (spin > 0.3) ctx.fillText('$', 0, 0);
        
        ctx.restore();
    },

    // Draw NPC
    drawNPC(ctx, x, y, type, time) {
        // type: 'good', 'bad', 'super_good', 'spy'
        ctx.save();
        ctx.translate(x, y);
        
        const colors = {
            good: '#4fc3f7',
            bad: '#ef5350',
            super_good: '#ffd700',
            spy: '#4fc3f7', // looks like good
        };
        
        const color = colors[type] || '#888';
        const radius = 12;
        
        // Body
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.ellipse(0, 2, radius, radius * 1.2, 0, 0, Math.PI * 2);
        ctx.fill();
        
        // Eyes
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(-4, -2, 3, 0, Math.PI * 2);
        ctx.arc(4, -2, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#333';
        ctx.beginPath();
        ctx.arc(-4, -2, 1.5, 0, Math.PI * 2);
        ctx.arc(4, -2, 1.5, 0, Math.PI * 2);
        ctx.fill();
        
        // Heart indicator (good NPCs have heart in pocket area)
        if (type === 'good' || type === 'super_good') {
            ctx.fillStyle = this.colors.heart;
            ctx.beginPath();
            ctx.moveTo(0, 8);
            ctx.bezierCurveTo(-3, 5, -5, 7, -5, 9);
            ctx.bezierCurveTo(-5, 11, 0, 14, 0, 14);
            ctx.bezierCurveTo(0, 14, 5, 11, 5, 9);
            ctx.bezierCurveTo(5, 7, 3, 5, 0, 8);
            ctx.fill();
        }
        
        // Spy has a slightly glitching heart (flickers)
        if (type === 'spy') {
            if (Math.sin(time * 5) > 0.3) {
                ctx.fillStyle = this.colors.heart;
                ctx.globalAlpha = 0.6;
                ctx.beginPath();
                ctx.moveTo(0, 8);
                ctx.bezierCurveTo(-3, 5, -5, 7, -5, 9);
                ctx.bezierCurveTo(-5, 11, 0, 14, 0, 14);
                ctx.bezierCurveTo(0, 14, 5, 11, 5, 9);
                ctx.bezierCurveTo(5, 7, 3, 5, 0, 8);
                ctx.fill();
                ctx.globalAlpha = 1;
            }
        }
        
        // Super good NPC has golden aura
        if (type === 'super_good') {
            ctx.strokeStyle = 'rgba(255, 215, 0, 0.5)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(0, 0, radius + 5 + Math.sin(time * 3) * 2, 0, Math.PI * 2);
            ctx.stroke();
        }
        
        // Bad NPC has angry eyebrows
        if (type === 'bad') {
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(-7, -6);
            ctx.lineTo(-2, -4);
            ctx.moveTo(7, -6);
            ctx.lineTo(2, -4);
            ctx.stroke();
        }
        
        ctx.restore();
    },

    // Draw enemy
    drawEnemy(ctx, x, y, type, time, hp, maxHp) {
        ctx.save();
        ctx.translate(x, y);
        
        if (type === 'slime') {
            // Small slime enemy
            ctx.fillStyle = '#7b1fa2';
            ctx.beginPath();
            const squish = 1 + Math.sin(time * 4) * 0.1;
            ctx.ellipse(0, 2, 10 * squish, 10 / squish, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(-3, -1, 2, 0, Math.PI * 2);
            ctx.arc(3, -1, 2, 0, Math.PI * 2);
            ctx.fill();
        } else if (type === 'fungi') {
            // Fungi enemy
            ctx.fillStyle = '#9c27b0';
            ctx.beginPath();
            ctx.ellipse(0, 4, 8, 6, 0, 0, Math.PI * 2);
            ctx.fill();
            // Cap
            ctx.fillStyle = '#e91e63';
            ctx.beginPath();
            ctx.ellipse(0, -4, 10, 8, 0, Math.PI, Math.PI * 2);
            ctx.fill();
            // Dots
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(-4, -6, 2, 0, Math.PI * 2);
            ctx.arc(3, -5, 1.5, 0, Math.PI * 2);
            ctx.fill();
        } else if (type === 'boss') {
            // Final boss - large monster
            const bossRadius = 30;
            ctx.fillStyle = '#1a1a1a';
            ctx.beginPath();
            ctx.ellipse(0, 0, bossRadius, bossRadius * 1.2, 0, 0, Math.PI * 2);
            ctx.fill();
            // Red eyes
            ctx.fillStyle = '#ff0000';
            ctx.beginPath();
            ctx.arc(-10, -8, 5, 0, Math.PI * 2);
            ctx.arc(10, -8, 5, 0, Math.PI * 2);
            ctx.fill();
            // Horns
            ctx.fillStyle = '#4a0000';
            ctx.beginPath();
            ctx.moveTo(-15, -25);
            ctx.lineTo(-8, -10);
            ctx.lineTo(-20, -10);
            ctx.closePath();
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(15, -25);
            ctx.lineTo(8, -10);
            ctx.lineTo(20, -10);
            ctx.closePath();
            ctx.fill();
            // Mouth
            ctx.strokeStyle = '#ff0000';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(0, 10, 12, 0.2, Math.PI - 0.2);
            ctx.stroke();
        }
        
        // HP bar above enemy
        if (hp !== undefined && hp < maxHp) {
            const barWidth = 24;
            ctx.fillStyle = '#333';
            ctx.fillRect(-barWidth/2, -20, barWidth, 4);
            ctx.fillStyle = '#ff4444';
            ctx.fillRect(-barWidth/2, -20, barWidth * (hp / maxHp), 4);
        }
        
        ctx.restore();
    },

    // Draw pet companion
    drawPet(ctx, x, y, power, time) {
        ctx.save();
        ctx.translate(x, y);
        const float = Math.sin(time * 3) * 3;
        ctx.translate(0, float);
        
        // Small star-shaped pet
        const color = power > 50 ? '#ffd700' : power > 25 ? '#ff69b4' : '#87ceeb';
        ctx.fillStyle = color;
        ctx.beginPath();
        for (let i = 0; i < 5; i++) {
            const angle = (i * 4 * Math.PI / 5) - Math.PI / 2;
            const r = i % 2 === 0 ? 8 : 4;
            ctx.lineTo(Math.cos(angle) * r, Math.sin(angle) * r);
        }
        ctx.closePath();
        ctx.fill();
        
        // Eyes
        ctx.fillStyle = '#333';
        ctx.beginPath();
        ctx.arc(-2, 0, 1, 0, Math.PI * 2);
        ctx.arc(2, 0, 1, 0, Math.PI * 2);
        ctx.fill();
        
        ctx.restore();
    },

    // Draw water drop (desert effect)
    drawWaterDrop(ctx, x, y, alpha) {
        ctx.save();
        ctx.translate(x, y);
        ctx.globalAlpha = alpha;
        
        ctx.fillStyle = '#42a5f5';
        ctx.beginPath();
        ctx.moveTo(0, -5);
        ctx.bezierCurveTo(-4, 0, -4, 4, 0, 6);
        ctx.bezierCurveTo(4, 4, 4, 0, 0, -5);
        ctx.fill();
        
        ctx.restore();
    },

    // Tile drawing
    drawTile(ctx, x, y, tileSize, tileType) {
        ctx.save();
        switch(tileType) {
            case 'grass':
                ctx.fillStyle = '#6ab04c';
                ctx.fillRect(x, y, tileSize, tileSize);
                // Random grass blades
                ctx.fillStyle = '#4caf50';
                ctx.fillRect(x + 5, y + 3, 2, 6);
                ctx.fillRect(x + 12, y + 8, 2, 5);
                ctx.fillRect(x + 20, y + 2, 2, 7);
                break;
            case 'sand':
                ctx.fillStyle = '#f4d03f';
                ctx.fillRect(x, y, tileSize, tileSize);
                ctx.fillStyle = '#d4ac0f';
                ctx.fillRect(x + 8, y + 12, 3, 2);
                ctx.fillRect(x + 18, y + 5, 2, 2);
                break;
            case 'water':
                ctx.fillStyle = '#42a5f5';
                ctx.fillRect(x, y, tileSize, tileSize);
                ctx.fillStyle = 'rgba(255,255,255,0.3)';
                ctx.fillRect(x + 4, y + 8, 8, 2);
                ctx.fillRect(x + 14, y + 14, 6, 2);
                break;
            case 'path':
                ctx.fillStyle = '#a0855b';
                ctx.fillRect(x, y, tileSize, tileSize);
                ctx.fillStyle = '#8B7355';
                ctx.fillRect(x + 6, y + 4, 4, 3);
                ctx.fillRect(x + 16, y + 16, 3, 3);
                break;
            case 'cave':
                ctx.fillStyle = '#37474f';
                ctx.fillRect(x, y, tileSize, tileSize);
                ctx.fillStyle = '#263238';
                ctx.fillRect(x + 3, y + 3, 5, 5);
                ctx.fillRect(x + 15, y + 12, 4, 4);
                break;
            case 'mountain':
                ctx.fillStyle = '#455a64';
                ctx.fillRect(x, y, tileSize, tileSize);
                ctx.fillStyle = '#37474f';
                ctx.beginPath();
                ctx.moveTo(x + 12, y + 2);
                ctx.lineTo(x + 4, y + 20);
                ctx.lineTo(x + 20, y + 20);
                ctx.closePath();
                ctx.fill();
                break;
            case 'wall':
                ctx.fillStyle = '#5d4037';
                ctx.fillRect(x, y, tileSize, tileSize);
                ctx.strokeStyle = '#3e2723';
                ctx.strokeRect(x + 1, y + 1, tileSize - 2, tileSize - 2);
                break;
            case 'tree':
                ctx.fillStyle = '#6ab04c';
                ctx.fillRect(x, y, tileSize, tileSize);
                // Trunk
                ctx.fillStyle = '#5d4037';
                ctx.fillRect(x + 10, y + 14, 4, 10);
                // Canopy
                ctx.fillStyle = '#2e7d32';
                ctx.beginPath();
                ctx.arc(x + 12, y + 10, 8, 0, Math.PI * 2);
                ctx.fill();
                break;
            case 'shop':
                ctx.fillStyle = '#a0855b';
                ctx.fillRect(x, y, tileSize, tileSize);
                ctx.fillStyle = '#795548';
                ctx.fillRect(x + 2, y + 2, tileSize - 4, tileSize - 4);
                ctx.fillStyle = '#ffd700';
                ctx.font = '12px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('🏪', x + 12, y + 16);
                break;
            case 'house_danger':
                ctx.fillStyle = '#a0855b';
                ctx.fillRect(x, y, tileSize, tileSize);
                ctx.fillStyle = '#4a148c';
                ctx.fillRect(x + 2, y + 2, tileSize - 4, tileSize - 4);
                ctx.fillStyle = '#ff0000';
                ctx.font = '10px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('🏚️', x + 12, y + 16);
                break;
            case 'portal':
                ctx.fillStyle = '#6ab04c';
                ctx.fillRect(x, y, tileSize, tileSize);
                ctx.fillStyle = 'rgba(100, 200, 255, 0.5)';
                ctx.beginPath();
                ctx.arc(x + 12, y + 12, 8, 0, Math.PI * 2);
                ctx.fill();
                break;
            case 'entrance':
                ctx.fillStyle = '#5d4037';
                ctx.fillRect(x, y, tileSize, tileSize);
                // Door shape
                ctx.fillStyle = '#3e2723';
                ctx.fillRect(x + 8, y + 4, 16, 24);
                // Door handle
                ctx.fillStyle = '#ffd700';
                ctx.beginPath();
                ctx.arc(x + 20, y + 16, 2, 0, Math.PI * 2);
                ctx.fill();
                // Arrow hint
                ctx.fillStyle = 'rgba(255, 215, 0, 0.6)';
                ctx.font = '10px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('▼', x + 16, y + 30);
                break;
            case 'furniture':
                ctx.fillStyle = '#a0855b';
                ctx.fillRect(x, y, tileSize, tileSize);
                // Wooden furniture block
                ctx.fillStyle = '#6d4c41';
                ctx.fillRect(x + 4, y + 4, tileSize - 8, tileSize - 8);
                ctx.fillStyle = '#8d6e63';
                ctx.fillRect(x + 6, y + 6, tileSize - 12, tileSize - 12);
                // Decorative top line
                ctx.fillStyle = '#4e342e';
                ctx.fillRect(x + 4, y + 4, tileSize - 8, 3);
                break;
            default:
                ctx.fillStyle = '#333';
                ctx.fillRect(x, y, tileSize, tileSize);
        }
        ctx.restore();
    }
};

const Audio = {
    ctx: null,
    musicGain: null,
    sfxGain: null,
    musicPlaying: false,
    currentNotes: [],
    noteIndex: 0,
    nextNoteTime: 0,
    tempo: 120, // BPM

    // Pentatonic scale notes (frequencies) for cute/adventure feel
    melodyNotes: [
        523.25, 587.33, 659.25, 783.99, 880.00, // C5, D5, E5, G5, A5
        1046.50, 987.77, 880.00, 783.99, 659.25, // C6, B5, A5, G5, E5
        523.25, 587.33, 783.99, 880.00, 659.25, // variation
        783.99, 659.25, 587.33, 523.25, 440.00, // descending
    ],

    bassNotes: [
        130.81, 130.81, 164.81, 164.81, // C3, C3, E3, E3
        174.61, 174.61, 196.00, 196.00, // F3, F3, G3, G3
        130.81, 164.81, 196.00, 174.61, // C3, E3, G3, F3
        220.00, 196.00, 164.81, 130.81, // A3, G3, E3, C3
    ],

    init() {
        try {
            this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            this.musicGain = this.ctx.createGain();
            this.musicGain.gain.value = 0.15;
            this.musicGain.connect(this.ctx.destination);

            this.sfxGain = this.ctx.createGain();
            this.sfxGain.gain.value = 0.3;
            this.sfxGain.connect(this.ctx.destination);
        } catch (e) {
            // Audio not supported
        }
    },

    resume() {
        if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume();
        }
    },

    startMusic() {
        if (!this.ctx || this.musicPlaying) return;
        this.musicPlaying = true;
        this.noteIndex = 0;
        this.nextNoteTime = this.ctx.currentTime;
        this.scheduleMusic();
    },

    stopMusic() {
        this.musicPlaying = false;
    },

    // Intro cutscene music - gentle, dreamy lullaby
    introMusicPlaying: false,
    introNoteIndex: 0,
    introNextNoteTime: 0,

    introMelody: [
        392.00, 440.00, 523.25, 587.33, 523.25, 440.00, // G4 A4 C5 D5 C5 A4
        392.00, 349.23, 329.63, 349.23, 392.00, 440.00, // G4 F4 E4 F4 G4 A4
        523.25, 587.33, 659.25, 587.33, 523.25, 440.00, // C5 D5 E5 D5 C5 A4
        392.00, 440.00, 523.25, 392.00, 349.23, 329.63, // G4 A4 C5 G4 F4 E4
    ],
    introBass: [
        196.00, 196.00, 220.00, 220.00, 261.63, 261.63, // G3 G3 A3 A3 C4 C4
        174.61, 174.61, 164.81, 164.81, 196.00, 196.00, // F3 F3 E3 E3 G3 G3
        261.63, 261.63, 293.66, 293.66, 261.63, 261.63, // C4 C4 D4 D4 C4 C4
        196.00, 196.00, 174.61, 174.61, 164.81, 164.81, // G3 G3 F3 F3 E3 E3
    ],

    startIntroMusic() {
        if (!this.ctx || this.introMusicPlaying) return;
        this.introMusicPlaying = true;
        this.introNoteIndex = 0;
        this.introNextNoteTime = this.ctx.currentTime;
        this.scheduleIntroMusic();
    },

    stopIntroMusic() {
        this.introMusicPlaying = false;
    },

    scheduleIntroMusic() {
        if (!this.introMusicPlaying || !this.ctx) return;

        const beatDuration = 60 / 72; // Slow tempo (72 BPM)

        while (this.introNextNoteTime < this.ctx.currentTime + 0.5) {
            const melodyNote = this.introMelody[this.introNoteIndex % this.introMelody.length];
            const bassNote = this.introBass[this.introNoteIndex % this.introBass.length];

            // Melody - sine wave (soft, dreamlike)
            this.playTone(melodyNote, this.introNextNoteTime, beatDuration * 1.2, 'sine', 0.1);
            // Bass - triangle wave (warm)
            this.playTone(bassNote, this.introNextNoteTime, beatDuration * 1.5, 'triangle', 0.06);
            // Shimmer - high octave sine (twinkle)
            if (this.introNoteIndex % 3 === 0) {
                this.playTone(melodyNote * 2, this.introNextNoteTime + beatDuration * 0.3, beatDuration * 0.6, 'sine', 0.03);
            }

            this.introNoteIndex++;
            this.introNextNoteTime += beatDuration;
        }

        if (this.introMusicPlaying) {
            setTimeout(() => this.scheduleIntroMusic(), 200);
        }
    },

    scheduleMusic() {
        if (!this.musicPlaying || !this.ctx) return;

        const beatDuration = 60 / this.tempo;

        while (this.nextNoteTime < this.ctx.currentTime + 0.5) {
            const melodyNote = this.melodyNotes[this.noteIndex % this.melodyNotes.length];
            const bassNote = this.bassNotes[this.noteIndex % this.bassNotes.length];

            // Melody (square wave - 8-bit feel)
            this.playTone(melodyNote, this.nextNoteTime, beatDuration * 0.8, 'square', 0.08);
            // Bass (triangle wave - soft)
            this.playTone(bassNote, this.nextNoteTime, beatDuration * 0.9, 'triangle', 0.1);

            this.noteIndex++;
            this.nextNoteTime += beatDuration;
        }

        if (this.musicPlaying) {
            setTimeout(() => this.scheduleMusic(), 200);
        }
    },

    playTone(freq, startTime, duration, type, volume) {
        if (!this.ctx) return;

        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = type;
        osc.frequency.value = freq;

        gain.gain.setValueAtTime(volume, startTime);
        gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);

        osc.connect(gain);
        gain.connect(this.musicGain);

        osc.start(startTime);
        osc.stop(startTime + duration + 0.05);
    },

    // Sound effects
    playSFX(type) {
        if (!this.ctx) return;
        this.resume();

        switch (type) {
            case 'collect':
                this.playChirp(880, 1100, 0.1);
                break;
            case 'coin':
                this.playChirp(1200, 1500, 0.08);
                setTimeout(() => this.playChirp(1500, 1800, 0.08), 80);
                break;
            case 'hit':
                // Pink wave attack sound - rising chirp
                this.playChirp(600, 1200, 0.08);
                setTimeout(() => this.playChirp(900, 1400, 0.06), 50);
                break;
            case 'damage':
                this.playChirp(300, 150, 0.15);
                this.playNoise(0.08);
                break;
            case 'grow':
                this.playChirp(400, 800, 0.2);
                break;
            case 'portal':
                this.playChirp(500, 1000, 0.3);
                setTimeout(() => this.playChirp(700, 1200, 0.2), 150);
                break;
            case 'error':
                this.playChirp(300, 200, 0.15);
                setTimeout(() => this.playChirp(200, 150, 0.15), 100);
                break;
            case 'victory':
                [0, 100, 200, 300, 400].forEach((delay, i) => {
                    setTimeout(() => this.playChirp(600 + i * 100, 800 + i * 150, 0.15), delay);
                });
                break;
        }
    },

    playChirp(startFreq, endFreq, duration) {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'square';
        osc.frequency.setValueAtTime(startFreq, this.ctx.currentTime);
        osc.frequency.linearRampToValueAtTime(endFreq, this.ctx.currentTime + duration);

        gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);

        osc.connect(gain);
        gain.connect(this.sfxGain);

        osc.start();
        osc.stop(this.ctx.currentTime + duration + 0.01);
    },

    playNoise(duration) {
        if (!this.ctx) return;
        const bufferSize = this.ctx.sampleRate * duration;
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
            data[i] = Math.random() * 2 - 1;
        }

        const source = this.ctx.createBufferSource();
        const gain = this.ctx.createGain();
        source.buffer = buffer;
        gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);

        source.connect(gain);
        gain.connect(this.sfxGain);
        source.start();
    },

    setMusicVolume(v) {
        if (this.musicGain) this.musicGain.gain.value = v;
    },

    setSFXVolume(v) {
        if (this.sfxGain) this.sfxGain.gain.value = v;
    }
};

// World management
const World = {
    currentZone: null,
    currentMap: null,
    items: [],
    waterDrops: [], // desert effect

    loadZone(zoneName) {
        const zone = ZONES[zoneName];
        if (!zone) return false;
        
        this.currentZone = zoneName;
        this.currentMap = zone.generateMap();
        this.items = zone.spawnItems();
        this.waterDrops = [];
        
        return true;
    },

    getTile(x, y) {
        if (!this.currentMap) return 'wall';
        if (y < 0 || y >= this.currentMap.length || x < 0 || x >= this.currentMap[0].length) {
            return 'wall';
        }
        return this.currentMap[y][x];
    },

    isWalkable(tileX, tileY) {
        const tile = this.getTile(tileX, tileY);
        return tile !== 'wall' && tile !== 'tree' && tile !== 'mountain' && tile !== 'water' && tile !== 'portal' && tile !== 'entrance' && tile !== 'furniture';
    },

    isPortal(tileX, tileY) {
        const tile = this.getTile(tileX, tileY);
        return tile === 'portal' || tile === 'entrance';
    },

    getPortalDestination(tileX, tileY) {
        const zone = ZONES[this.currentZone];
        if (!zone || !zone.portals) return null;
        
        const map = this.currentMap;
        const tile = this.getTile(tileX, tileY);
        
        // Check for entrance tiles (sub-map entrances stored in zone.entrances)
        if (tile === 'entrance' && zone.entrances) {
            for (const entrance of zone.entrances) {
                if (entrance.x === tileX && entrance.y === tileY) {
                    return entrance.dest;
                }
            }
        }
        
        // Edge-based portals
        if (tileX === 0) return zone.portals.west;
        if (tileX === map[0].length - 1) return zone.portals.east;
        if (tileY === 0) return zone.portals.north;
        if (tileY === map.length - 1) return zone.portals.south;
        return null;
    },

    isDesert() {
        return ZONES[this.currentZone]?.isDangerous === true;
    },

    addWaterDrop(x, y) {
        this.waterDrops.push({ x, y, alpha: 1.0, time: 0 });
    },

    updateWaterDrops(dt) {
        for (let i = this.waterDrops.length - 1; i >= 0; i--) {
            this.waterDrops[i].alpha -= dt * 0.3;
            this.waterDrops[i].time += dt;
            if (this.waterDrops[i].alpha <= 0) {
                this.waterDrops.splice(i, 1);
            }
        }
    },

    collectItem(tileX, tileY) {
        for (let i = this.items.length - 1; i >= 0; i--) {
            if (this.items[i].x === tileX && this.items[i].y === tileY) {
                const item = this.items.splice(i, 1)[0];
                return item;
            }
        }
        return null;
    },

    // Check if near an item (within 1 tile)
    getNearbyItem(tileX, tileY) {
        for (let i = 0; i < this.items.length; i++) {
            const dx = Math.abs(this.items[i].x - tileX);
            const dy = Math.abs(this.items[i].y - tileY);
            if (dx <= 1 && dy <= 1) {
                return i;
            }
        }
        return -1;
    }
};

// === player.js ===
// player.js - Player state, movement, and growth
const Player = {
    // Position (in tile coordinates)
    tileX: 4,
    tileY: 10,
    // Pixel position for smooth movement
    pixelX: 0,
    pixelY: 0,
    // Movement
    speed: 3.0, // tiles per second base (fast movement)
    moving: false,
    targetX: 0,
    targetY: 0,
    moveProgress: 0,
    lastMoveTime: 0,
    direction: 'down', // up, down, left, right
    
    // Stats
    sizeMM: 5, // starts at 5mm
    maxHP: 100,
    hp: 100,
    coins: 0,
    attackPower: 5,
    weapon: null, // current equipped weapon
    weaponBonus: 0, // attack bonus from weapon
    weaponInventory: [], // all collected weapons
    
    // Growth stage (0-4): tiny, small, medium, large, giant
    get stage() {
        if (this.sizeMM >= 15000) return 4;
        if (this.sizeMM >= 5000) return 3;
        if (this.sizeMM >= 1000) return 2;
        if (this.sizeMM >= 100) return 1;
        return 0;
    },
    
    // Pet
    hasPet: false,
    petPower: 0,
    
    // Flags
    hasGiantClay: false,
    fungiDefeated: 0,
    fungiChallengeActive: false,
    fungiChallengeComplete: false,
    fungiChallengeTriggered: false,
    bossDefeated: false,
    friendRescued: false,
    visitedZones: new Set(['start']),
    
    // Desert step tracking
    lastDesertTile: null,

    init() {
        this.pixelX = this.tileX * TILE_SIZE + TILE_SIZE / 2;
        this.pixelY = this.tileY * TILE_SIZE + TILE_SIZE / 2;
        this.targetX = this.pixelX;
        this.targetY = this.pixelY;
    },

    // Get effective speed (slower when tiny, faster when big)
    getSpeed() {
        const stageBonus = this.stage * 0.3;
        return (this.speed + stageBonus) * TILE_SIZE;
    },

    // Growth
    grow(amount) {
        this.sizeMM = Math.max(1, this.sizeMM + amount);
        // Update attack power based on size + weapon
        this.attackPower = 5 + Math.floor(this.sizeMM / 100) * 2 + this.petPower + this.weaponBonus;
    },

    shrink(amount) {
        this.sizeMM = Math.max(1, this.sizeMM - amount);
        if (this.sizeMM <= 1) {
            // Game over check
            return true;
        }
        return false;
    },

    // Take damage
    takeDamage(amount) {
        this.hp = Math.max(0, this.hp - amount);
        return this.hp <= 0;
    },

    heal(amount) {
        this.hp = Math.min(this.maxHP, this.hp + amount);
    },

    // Equip weapon
    equipWeapon(weaponData) {
        this.weapon = weaponData;
        this.weaponBonus = weaponData.attackBonus;
        // Recalculate attack power
        this.attackPower = 5 + Math.floor(this.sizeMM / 100) * 2 + this.petPower + this.weaponBonus;
    },

    // Movement
    tryMove(dx, dy) {
        if (this.moving) return false;
        
        const newTileX = this.tileX + dx;
        const newTileY = this.tileY + dy;
        
        // Set direction
        if (dx > 0) this.direction = 'right';
        else if (dx < 0) this.direction = 'left';
        else if (dy > 0) this.direction = 'down';
        else if (dy < 0) this.direction = 'up';
        
        if (!World.isWalkable(newTileX, newTileY)) {
            // Check if it's a portal
            if (World.isPortal(newTileX, newTileY)) {
                return { type: 'portal', tileX: newTileX, tileY: newTileY };
            }
            return false;
        }
        
        this.moving = true;
        this.targetX = newTileX * TILE_SIZE + TILE_SIZE / 2;
        this.targetY = newTileY * TILE_SIZE + TILE_SIZE / 2;
        this.moveProgress = 0;
        this.tileX = newTileX;
        this.tileY = newTileY;
        
        return { type: 'move' };
    },

    update(dt) {
        if (this.moving) {
            const speed = this.getSpeed();
            const dx = this.targetX - this.pixelX;
            const dy = this.targetY - this.pixelY;
            const dist = Math.sqrt(dx * dx + dy * dy);
            
            if (dist < 1) {
                this.moving = false;
                this.pixelX = this.targetX;
                this.pixelY = this.targetY;
            } else {
                const step = Math.min(speed * dt, dist);
                this.pixelX += (dx / dist) * step;
                this.pixelY += (dy / dist) * step;
            }
        }
    },

    // Get display size text
    getSizeDisplay() {
        if (this.sizeMM >= 10000) {
            return (this.sizeMM / 1000).toFixed(1) + 'm';
        } else if (this.sizeMM >= 1000) {
            return (this.sizeMM / 10).toFixed(0) + 'cm';
        }
        return this.sizeMM + 'mm';
    },

    // Serialization for save
    serialize() {
        return {
            tileX: this.tileX,
            tileY: this.tileY,
            sizeMM: this.sizeMM,
            hp: this.hp,
            maxHP: this.maxHP,
            coins: this.coins,
            hasPet: this.hasPet,
            petPower: this.petPower,
            hasGiantClay: this.hasGiantClay,
            fungiDefeated: this.fungiDefeated,
            fungiChallengeComplete: this.fungiChallengeComplete,
            bossDefeated: this.bossDefeated,
            friendRescued: this.friendRescued,
            visitedZones: [...this.visitedZones],
            currentZone: World.currentZone,
            weapon: this.weapon,
            weaponBonus: this.weaponBonus,
            weaponInventory: this.weaponInventory,
        };
    },

    deserialize(data) {
        if (!data) return;
        this.tileX = data.tileX;
        this.tileY = data.tileY;
        this.sizeMM = data.sizeMM;
        this.hp = data.hp;
        this.maxHP = data.maxHP || 100;
        this.coins = data.coins;
        this.hasPet = data.hasPet;
        this.petPower = data.petPower;
        this.hasGiantClay = data.hasGiantClay;
        this.fungiDefeated = data.fungiDefeated;
        this.fungiChallengeComplete = data.fungiChallengeComplete || false;
        this.bossDefeated = data.bossDefeated;
        this.friendRescued = data.friendRescued;
        this.visitedZones = new Set(data.visitedZones || ['start']);
        this.weapon = data.weapon || null;
        this.weaponBonus = data.weaponBonus || 0;
        this.weaponInventory = data.weaponInventory || [];
        this.pixelX = this.tileX * TILE_SIZE + TILE_SIZE / 2;
        this.pixelY = this.tileY * TILE_SIZE + TILE_SIZE / 2;
        this.targetX = this.pixelX;
        this.targetY = this.pixelY;
        // Recalculate attack power
        this.attackPower = 5 + Math.floor(this.sizeMM / 100) * 2 + this.petPower + this.weaponBonus;
    }
};

    loadNPCs(zoneName) {
        const zone = ZONES[zoneName];
        if (!zone) return;
        this.npcs = zone.spawnNPCs();
    },

    getNPCAt(tileX, tileY) {
        for (const npc of this.npcs) {
            if (Math.abs(npc.x - tileX) <= 1 && Math.abs(npc.y - tileY) <= 1) {
                return npc;
            }
        }
        return null;
    },

    startDialogue(dialogueId) {
        const dialogue = this.dialogues[dialogueId];
        if (!dialogue) return null;
        this.activeDialogue = dialogueId;
        return dialogue;
    },

    getDialogue(dialogueId) {
        return this.dialogues[dialogueId] || null;
    },

    processKeywordInput(text, dialogueId) {
        const dialogue = this.dialogues[dialogueId];
        if (!dialogue || !dialogue.keywords) return null;
        
        for (const [pattern, response] of Object.entries(dialogue.keywords)) {
            const regex = new RegExp(pattern, 'i');
            if (regex.test(text)) {
                return response;
            }
        }
        return { text: '（对方似乎不太理解你的话...）', effect: null };
    },

    applyEffect(effect) {
        if (!effect) return;
        
        if (effect.coins) {
            Player.coins = Math.max(0, Player.coins + effect.coins);
        }
        if (effect.size) {
            Player.grow(effect.size);
        }
        if (effect.hp) {
            if (effect.hp > 0) {
                Player.heal(effect.hp);
            } else {
                Player.takeDamage(-effect.hp);
            }
        }
        if (effect.pet) {
            Player.hasPet = true;
        }
        if (effect.petPower) {
            Player.petPower += effect.petPower;
            Player.attackPower += effect.petPower;
        }
        if (effect.openShop) {
            Shop.openRealShop();
        }
        if (effect.attackPower) {
            Player.attackPower += effect.attackPower;
        }
        if (effect.startFungiChallenge) {
            Player.fungiChallengeActive = true;
        }
        if (effect.fungiChallengeComplete) {
            Player.fungiChallengeComplete = true;
        }
        if (effect.startBoss) {
            // Handled by main game loop
        }
        if (effect.victory) {
            Player.friendRescued = true;
        }
    }
};

// combat.js - Combat system with enemy AI movement
const Combat = {
    active: false,
    enemies: [],
    currentEnemy: null,
    playerAttackCooldown: 0,
    enemyAttackCooldown: 0,
    fungiWave: 0,
    fungiTotal: 0,
    enemyMoveTimer: 0,
    
    PLAYER_ATTACK_RATE: 0.4, // seconds between attacks
    ENEMY_ATTACK_RATE: 1.2,
    ENEMY_MOVE_RATE: 1.0, // seconds between enemy movements

    loadEnemies(zoneName) {
        const zone = ZONES[zoneName];
        if (!zone) return;
        this.enemies = zone.spawnEnemies().map((e, i) => ({
            ...e,
            id: i,
            alive: true,
            attackTimer: 0,
            hitFlash: 0,
            moveTimer: Math.random() * this.ENEMY_MOVE_RATE,
            pixelX: e.x * TILE_SIZE + TILE_SIZE / 2,
            pixelY: e.y * TILE_SIZE + TILE_SIZE / 2,
        }));
    },

    getEnemyNear(tileX, tileY, range = 2) {
        for (const enemy of this.enemies) {
            if (!enemy.alive) continue;
            const dx = Math.abs(enemy.x - tileX);
            const dy = Math.abs(enemy.y - tileY);
            if (dx <= range && dy <= range) {
                return enemy;
            }
        }
        return null;
    },

    startCombat(enemy) {
        this.active = true;
        this.currentEnemy = enemy;
        this.playerAttackCooldown = 0;
        this.enemyAttackCooldown = 0;
    },

    endCombat() {
        this.active = false;
        this.currentEnemy = null;
    },

    playerAttack() {
        if (!this.active || !this.currentEnemy || this.playerAttackCooldown > 0) return null;
        
        const damage = Player.attackPower + (Player.hasPet ? Player.petPower : 0);
        this.currentEnemy.hp -= damage;
        this.currentEnemy.hitFlash = 0.2;
        this.playerAttackCooldown = this.PLAYER_ATTACK_RATE;
        
        if (this.currentEnemy.hp <= 0) {
            const enemy = this.currentEnemy;
            this.currentEnemy.alive = false;
            const rewards = this.getKillRewards(this.currentEnemy);
            this.endCombat();
            return { type: 'kill', rewards, damage, enemy };
        }
        
        return { type: 'hit', damage };
    },

    update(dt) {
        if (!this.active || !this.currentEnemy) return null;
        
        // Cooldowns
        if (this.playerAttackCooldown > 0) {
            this.playerAttackCooldown -= dt;
        }
        
        // Enemy attacks
        this.enemyAttackCooldown -= dt;
        if (this.enemyAttackCooldown <= 0) {
            this.enemyAttackCooldown = this.ENEMY_ATTACK_RATE;
            const enemyX = this.currentEnemy.pixelX || (this.currentEnemy.x * TILE_SIZE + TILE_SIZE / 2);
            const enemyY = this.currentEnemy.pixelY || (this.currentEnemy.y * TILE_SIZE + TILE_SIZE / 2);
            const dead = Player.takeDamage(this.currentEnemy.damage);
            if (dead) {
                return { type: 'player_dead', damage: this.currentEnemy.damage, enemyX, enemyY };
            }
            return { type: 'enemy_attack', damage: this.currentEnemy.damage, enemyX, enemyY };
        }
        
        // Hit flash
        if (this.currentEnemy.hitFlash > 0) {
            this.currentEnemy.hitFlash -= dt;
        }
        
        return null;
    },

    updateEnemyMovement(dt) {
        for (const enemy of this.enemies) {
            if (!enemy.alive) continue;
            if (enemy.isBoss) continue; // Boss doesn't wander
            
            enemy.moveTimer -= dt;
            if (enemy.moveTimer <= 0) {
                enemy.moveTimer = this.ENEMY_MOVE_RATE + Math.random() * 0.5;
                
                // Move toward player if close, else random
                const distToPlayer = Math.abs(enemy.x - Player.tileX) + Math.abs(enemy.y - Player.tileY);
                let dx = 0, dy = 0;
                
                if (distToPlayer <= 5) {
                    // Chase player
                    dx = Math.sign(Player.tileX - enemy.x);
                    dy = Math.sign(Player.tileY - enemy.y);
                    // Pick one direction
                    if (Math.random() > 0.5) dx = 0;
                    else dy = 0;
                } else {
                    // Random walk
                    const dir = Math.floor(Math.random() * 4);
                    if (dir === 0) dx = 1;
                    else if (dir === 1) dx = -1;
                    else if (dir === 2) dy = 1;
                    else dy = -1;
                }
                
                const newX = enemy.x + dx;
                const newY = enemy.y + dy;
                
                if (World.isWalkable(newX, newY)) {
                    enemy.x = newX;
                    enemy.y = newY;
                    enemy.pixelX = newX * TILE_SIZE + TILE_SIZE / 2;
                    enemy.pixelY = newY * TILE_SIZE + TILE_SIZE / 2;
                }
            }
        }
    },

    getKillRewards(enemy) {
        const rewards = { coins: 0, clay: 0, message: '' };
        
        switch (enemy.type) {
            case 'slime':
                rewards.coins = 3 + Math.floor(Math.random() * 5);
                rewards.clay = 2 + Math.floor(Math.random() * 3);
                rewards.message = `击败史莱姆！+${rewards.coins}金币 +${rewards.clay}mm`;
                break;
            case 'fungi':
                rewards.coins = 2;
                rewards.clay = 1;
                Player.fungiDefeated++;
                rewards.message = `击败小菌！(${Player.fungiDefeated}/30) +${rewards.coins}金币`;
                
                if (Player.fungiDefeated >= 30 && !Player.hasGiantClay) {
                    rewards.giantClay = true;
                    rewards.message = '🎉 击败30只小菌！获得【巨型粘土】！体型 +10米！！！';
                    Player.hasGiantClay = true;
                    Player.grow(10000);
                    Player.fungiChallengeActive = false;
                    Player.fungiChallengeComplete = true;
                }
                break;
            case 'boss':
                rewards.message = '🎉🎉🎉 击败了山林巨兽！！！快去救你的朋友！';
                Player.bossDefeated = true;
                break;
        }
        
        Player.coins += rewards.coins;
        Player.grow(rewards.clay);
        
        return rewards;
    },

    spawnFungiWave() {
        if (Player.fungiDefeated >= 30) return;
        
        const remaining = 30 - Player.fungiDefeated;
        const waveSize = Math.min(5, remaining);
        
        for (let i = 0; i < waveSize; i++) {
            const x = 4 + Math.floor(Math.random() * 17);
            const y = 3 + Math.floor(Math.random() * 14);
            // Level scales with progress: 1-2 early, 2-3 late
            const level = Math.min(3, 1 + Math.floor(Player.fungiDefeated / 12));
            this.enemies.push({
                type: 'fungi',
                x: x,
                y: y,
                hp: 6 + level * 2,
                maxHp: 6 + level * 2,
                damage: level,
                level: level,
                id: this.enemies.length,
                alive: true,
                attackTimer: 0,
                hitFlash: 0,
                moveTimer: Math.random() * this.ENEMY_MOVE_RATE,
                pixelX: x * TILE_SIZE + TILE_SIZE / 2,
                pixelY: y * TILE_SIZE + TILE_SIZE / 2,
            });
        }
    },

    needsNewWave() {
        if (!Player.fungiChallengeActive) return false;
        if (Player.fungiDefeated >= 30) return false;
        const aliveFungi = this.enemies.filter(e => e.type === 'fungi' && e.alive);
        return aliveFungi.length === 0;
    }
};

        { id: 'shield', name: '防沙护盾', price: 25, desc: '进入沙漠前5步不减体型', effect: { desertShield: 5 } },
        { id: 'petfood', name: '星星零食', price: 40, desc: '宠物战力 +5', effect: { petPower: 5 } },
    ],

    fakeShopItems: [
        { id: 'fake1', name: '超级粘土（假）', price: 30, desc: '看起来很划算...', effect: { size: -30, coins: -10 } },
        { id: 'fake2', name: '神秘药水（假）', price: 20, desc: '闻起来怪怪的...', effect: { hp: -20 } },
        { id: 'fake3', name: '黄金护符（假）', price: 50, desc: '闪闪发光！', effect: { coins: -30 } },
    ],

    desertShield: 0, // steps protected in desert

    openRealShop() {
        this.isOpen = true;
        this.isFake = false;
        this.renderShop();
    },

    openFakeShop() {
        this.isOpen = true;
        this.isFake = true;
        this.renderShop();
    },

    renderShop() {
        const overlay = document.getElementById('shop-overlay');
        const title = document.getElementById('shop-title');
        const itemsDiv = document.getElementById('shop-items');
        
        overlay.classList.remove('hidden');
        
        if (this.isFake) {
            title.textContent = '🏪 超值好店（？）';
            title.style.color = '#ff6666';
        } else {
            title.textContent = '🏪 粘土补给商店';
            title.style.color = '#ffd700';
        }
        
        const items = this.isFake ? this.fakeShopItems : this.realShopItems;
        itemsDiv.innerHTML = '';
        
        items.forEach(item => {
            const div = document.createElement('div');
            div.className = 'shop-item';
            div.innerHTML = `
                <div class="item-name">${item.name}</div>
                <div class="item-price">💰 ${item.price} 金币</div>
                <div class="item-desc">${item.desc}</div>
            `;
            div.onclick = () => this.buyItem(item);
            itemsDiv.appendChild(div);
        });
    },

    buyItem(item) {
        if (Player.coins < item.price) {
            UI.showNotification('金币不够！');
            return;
        }
        
        Player.coins -= item.price;
        
        if (item.effect.hp) {
            if (item.effect.hp > 0) {
                Player.heal(item.effect.hp);
            } else {
                Player.takeDamage(-item.effect.hp);
            }
        }
        if (item.effect.size) {
            Player.grow(item.effect.size);
        }
        if (item.effect.coins) {
            Player.coins = Math.max(0, Player.coins + item.effect.coins);
        }
        if (item.effect.petPower && Player.hasPet) {
            Player.petPower += item.effect.petPower;
            Player.attackPower += item.effect.petPower;
        }
        if (item.effect.desertShield) {
            this.desertShield += item.effect.desertShield;
        }
        
        if (this.isFake) {
            UI.showNotification('💀 你被骗了！这是假商店！');
        } else {
            UI.showNotification(`购买成功：${item.name}`);
        }
        
        UI.updateHUD();
    },

    closeShop() {
        this.isOpen = false;
        document.getElementById('shop-overlay').classList.add('hidden');
    },

    // Check if player steps on shop tile
    checkShopTile(tileX, tileY) {
        const tile = World.getTile(tileX, tileY);
        if (tile === 'shop') {
            return 'real';
        }
        return null;
    }
};

    showNotification(text) {
        const container = document.getElementById('game-screen');
        const notif = document.createElement('div');
        notif.className = 'notification';
        notif.textContent = text;
        container.appendChild(notif);
        
        setTimeout(() => {
            if (notif.parentNode) {
                notif.parentNode.removeChild(notif);
            }
        }, 2200);
    },

    showZoneTransition(zoneName) {
        const container = document.getElementById('game-screen');
        const transition = document.createElement('div');
        transition.className = 'zone-transition';
        transition.textContent = zoneName;
        container.appendChild(transition);
        
        setTimeout(() => {
            if (transition.parentNode) {
                transition.parentNode.removeChild(transition);
            }
        }, 1600);
    },

    // Dialogue system
    showDialogue(dialogue, callback) {
        const overlay = document.getElementById('dialogue-overlay');
        const speaker = document.getElementById('dialogue-speaker');
        const text = document.getElementById('dialogue-text');
        const choices = document.getElementById('dialogue-choices');
        const inputArea = document.getElementById('dialogue-input-area');
        
        overlay.classList.remove('hidden');
        speaker.textContent = dialogue.speaker;
        text.textContent = dialogue.text;
        choices.innerHTML = '';
        this.dialogueCallback = callback;
        
        // Render choices
        if (dialogue.choices) {
            dialogue.choices.forEach((choice, i) => {
                const btn = document.createElement('button');
                btn.textContent = choice.text;
                btn.onclick = () => {
                    this.hideDialogue();
                    if (callback) callback({ type: 'choice', index: i, choice });
                };
                choices.appendChild(btn);
            });
        }
        
        // Show typing input if allowed
        if (dialogue.allowTyping) {
            inputArea.classList.remove('hidden');
            const input = document.getElementById('dialogue-input');
            input.value = '';
            input.focus();
        } else {
            inputArea.classList.add('hidden');
        }
    },

    hideDialogue() {
        document.getElementById('dialogue-overlay').classList.add('hidden');
        document.getElementById('dialogue-input-area').classList.add('hidden');
        this.dialogueCallback = null;
    },

    setupDialogueInput() {
        const input = document.getElementById('dialogue-input');
        const sendBtn = document.getElementById('dialogue-send');
        
        const sendMessage = () => {
            const text = input.value.trim();
            if (!text) return;
            input.value = '';
            
            if (this.dialogueCallback) {
                this.dialogueCallback({ type: 'text', text });
            }
        };
        
        sendBtn.onclick = sendMessage;
        input.onkeydown = (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                sendMessage();
            }
        };

    // Minimap
    drawMinimap() {
        const canvas = document.getElementById('minimap-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = 150;
        canvas.height = 120;
        
        const zone = ZONES[World.currentZone];
        if (!zone || !World.currentMap) return;
        
        const tileW = canvas.width / zone.width;
        const tileH = canvas.height / zone.height;
        
        // Draw tiles
        for (let y = 0; y < zone.height; y++) {
            for (let x = 0; x < zone.width; x++) {
                const tile = World.currentMap[y][x];
                let color;
                switch(tile) {
                    case 'grass': color = '#4caf50'; break;
                    case 'sand': color = '#f4d03f'; break;
                    case 'water': color = '#42a5f5'; break;
                    case 'path': color = '#a0855b'; break;
                    case 'cave': color = '#37474f'; break;
                    case 'mountain': color = '#455a64'; break;
                    case 'wall': color = '#5d4037'; break;
                    case 'tree': color = '#2e7d32'; break;
                    case 'portal': color = '#64b5f6'; break;
                    case 'entrance': color = '#8d6e63'; break;
                    case 'shop': color = '#ffd700'; break;
                    case 'house_danger': color = '#9c27b0'; break;
                    default: color = '#333';
                }
                ctx.fillStyle = color;
                ctx.fillRect(x * tileW, y * tileH, tileW, tileH);
            }
        }
        
        // Draw player position
        ctx.fillStyle = '#ff69b4';
        ctx.beginPath();
        ctx.arc(Player.tileX * tileW + tileW/2, Player.tileY * tileH + tileH/2, 3, 0, Math.PI * 2);
        ctx.fill();
        
        // Draw NPCs
        NPCSystem.npcs.forEach(npc => {
            ctx.fillStyle = npc.type === 'bad' ? '#ff4444' : '#4fc3f7';
            ctx.fillRect(npc.x * tileW, npc.y * tileH, tileW, tileH);
        });
        
        // Draw enemies
        Combat.enemies.forEach(enemy => {
            if (!enemy.alive) return;
            ctx.fillStyle = '#9c27b0';
            ctx.fillRect(enemy.x * tileW, enemy.y * tileH, tileW, tileH);
        });
    }
};
